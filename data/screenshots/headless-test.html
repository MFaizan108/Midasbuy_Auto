ail reminders at the following two times after subscribing:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. When the sharing assistance task reaches 3 people.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. When there are only 3 hours left to complete the sharing task.','سوف تتلقى تذكيرات بالبريد الإلكتروني في الوقتين التاليين بعد الاشتراك:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. عندما يصل عدد المشاركين في مهمة المساعدة في المشاركة إلى 3 أشخاص.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. عندما يتبقى 3 ساعات فقط لاستكمال مهمة المشاركة.','Recibirás recordatorios por correo electrónico en los siguientes dos momentos después de suscribirte:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Cuando la tarea de asistencia para compartir alcance a 3 personas.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Cuando queden solo 3 horas para completar la tarea de compartir.','Sie erhalten E-Mail-Erinnerungen zu den folgenden zwei Zeitpunkten nach der Anmeldung:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Wenn die Aufgabe zur Unterstützung beim Teilen von Inhalten von 3 Personen erreicht wird.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Wenn nur noch 3 Stunden für die Fertigstellung der Teilaufgabe verbleiben.',"Vous recevrez des rappels par e-mail aux deux moments suivants après vous être abonné :\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Lorsque la tâche d'assistance au partage atteint 3 personnes.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Lorsqu'il ne reste que 3 heures pour terminer la tâche de partage.",'Anda akan menerima pengingat email pada dua waktu berikut setelah berlangganan:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Ketika tugas bantuan berbagi mencapai 3 orang.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Ketika tinggal 3 jam lagi untuk menyelesaikan tugas berbagi.','Anda akan menerima pengingat melalui emel pada dua waktu berikut setelah melanggan:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Apabila tugas bantuan berkongsi mencapai 3 orang.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Apabila hanya tinggal 3 jam lagi untuk menyelesaikan tugas berkongsi.','Você receberá lembretes por e-mail nos seguintes dois momentos após se inscrever:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Quando a tarefa de assistência à partilha atingir 3 pessoas.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Quando faltarem apenas 3 horas para concluir a tarefa de partilha.','Вы получите напоминания по электронной почте в следующие два времени после подписки:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Когда задача по совместному использованию достигнет 3 человек.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Когда останется всего 3 часа для завершения задачи по совместному использованию.','Abone olduktan sonra aşağıdaki iki zaman diliminde e-posta hatırlatmaları alacaksınız:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. Paylaşım yardım görevi 3 kişiye ulaştığında.\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. Paylaşım görevini tamamlamak için sadece 3 saat kaldığında.','คุณจะได้รับอีเมลแจ้งเตือนในเวลาที่กำหนดดังต่อไปนี้หลังจากที่คุณสมัครสมาชิก:\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. เมื่องานช่วยเหลือในการแชร์มีผู้เข้าร่วมถึง 3 คน\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. เมื่อเหลือเวลาเพียง 3 ชั่วโมงในการสำเร็จงานแชร์','訂閱後，您將在以下兩個時間收到電子郵件提醒：\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n1. 當分享協助任務達到3人時。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\n2. 當完成分享任務僅剩下3小時時。'],['','','["notLoginStageConf.loginPromptHint","","component/gems-midasbuy_activity_materials/HelpGuestView","guest",8]','<p>The gif kingConf.emptyText","","component/gems-midasbuy_activity_materials/RankingBoard","host",19]','<p>No data</p>','لا توجد بيانات','Sin datos','Keine Daten','Aucune donnée','<p>Tidak ada data</p>','Tiada data','Sem dados','Нет данных','Veri yok','ไม่มีข้อมูล','<p>無數據</p>'],['','','["notification.title","","component/gems-midasbuy_activity_materials/base_midasbuy_embed","",45]','Midasbuy','ميداسباي','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy','Midasbuy'],['','','["shareStageConf.shareStepText","","component/gems-midasbuy_activity_materials/HelpHostView","host",15]','<p>​​Friends Get Free Coupons​​</p>','<p>​​الأصدقاء يحصلون على كوبونات مجانية​​</p>','<p>Amigos: cupones gratis</p>','<p>Gratis-Gutscheine für Freunde</p>','<p>Amis : coupons gratuits</p>','<p>Teman: kupon gratis</p>','<p>​​Teman dapat kupon gratis​​</p>','<p>​​Rakan dapat kupon percuma​​</p>','<p>Друзьям — купоны бесплатно</p>','<p>​​Arkadaşlar ücretsiz kupon kazanır​​</p>','<p>​​เพื่อนรับคูปองฟรี​​</p>','<p>​​好友免費領優惠券​</p>'],['','','["cdKeyClaimConf.claimStepsContent","","component/gems-midasbuy_activity_materials/RankingBoard","host",19]','<p>1.Go to the Midasbuy official Discord community, contact an admin, and provide your player ID, screenshot of your in-game winning page, and a screenshot of your game profile (or as required).</p><p><br></p><p>2.After the admin verifies that the information is correct, the prize will be issued to you.</p>','<p>1. انتقل إلى مجتمع Discord الرسمي لـ Midasbuy، وتواصل مع أحد المشرفين، وقدّم معرف اللاعب (ID)، ولقطة شاشة لصفحة الفوز داخل اللعبة، ولقطة شاشة لملفك الشخصي في اللعبة (أو حسب المطلوب).</p><p><br></p><p>2. بعد أن يتحقق المشرف من صحة المعلومات، سيتم إصدار الجائزة لك.</p>','<p>1. Ve a la comunidad oficial de Discord de Midasbuy, ponte en contacto con un administrador y proporciona tu ID de jugador, una captura de pantalla de tu página de victoria en el juego y una captura de pantalla de tu perfil del juego (o según se solicite).</p><p><br></p><p>2. Una vez que el administrador verifique que la información es correcta, se te entregará el premio.</p>','<p>1. Gehe zur offiziellen Discord-Community von Midasbuy, kontaktiere einen Admin und gib deine Spieler-ID, einen Screenshot deiner Gewinnsite im Spiel sowie einen Screenshot deines Spielprofils an (oder wie gefordert).</p><p><br></p><p>2. Nachdem der Admin die Richtigkeit der Angaben bestätigt hat, wird dir der Preis ausgestellt.</p>',"<p>1. Rendez-vous sur la communauté Discord officielle de Midasbuy, contactez un administrateur et fournissez votre ID de joueur, une capture d'écran de votre page de victoire en jeu et une capture d'écran de votre profil de jeu (ou selon les instructions).</p><p><br></p><p>2. Une fois que l'administrateur aura vérifié que les informations sont correctes, le prix vous sera attribué.</p>",'<p>1. Buka komunitas Discord resmi Midasbuy, hubungi admin, dan berikan ID pemain Anda, tangkapan layar halaman kemenangan dalam game, serta tangkapan layar profil game Anda (atau sesuai persyaratan).</p><p><br></p><p>2. Setelah admin memverifikasi bahwa informasi sudah benar, hadiah akan dikirimkan kepada Anda.</p>','<p>1. Pergi ke komuniti Discord rasmi Midasbuy, hubungi pentadbir dan berikan ID pemain anda, tangkapan skrin halaman kemenangan dalam permainan, serta tangkapan skrin profil permainan anda (atau seperti yang diperlukan).</p><p><br></p><p>2. Selepas pentadbir mengesahkan bahawa maklumat adalah betul, hadiah akan diberikan kepada anda.</p>','<p>1. Vá para a comunidade oficial do Midasbuy no Discord, entre em contato com um administrador e forneça seu ID de jogador, uma captura de tela da página de vitória no jogo e uma captura de tela do seu perfil do jogo (conforme solicitado).</p><p><br></p><p>2. Após o administrador verificar se as informações estão corretas, o prêmio será enviado a você.</p>','<p>1. Перейдите в официальное сообщество Midasbuy в Discord, свяжитесь с администратором и предоставьте ваш ID игрока, скриншот страницы с победой в игре и скриншот вашего игрового профиля (или по требованию).</p><p><br></p><p>2. После того как администратор проверит правильность информации, вам будет выдан приз.</p>',"<p>1. Midasbuy resmi Discord topluluğuna gidin, bir yöneticiyle iletişime geçin ve oyuncu ID'nizi, oyun içi kazanma sayfanızın ekran görüntüsünü ve oyun profilinizin ekran görüntüsünü (veya istendiği şekilde) sağlayın.</p><p><br></p><p>2. Yönetici bilgilerin doğru olduğunu doğruladıktan sonra ödül tarafınıza gönderilecektir.</p>",'<p>1. ไปที่ชุมชน Discord อย่างเป็นทางการของ Midasbuy ติดต่อผู้ดูแลระบบ และส่ง ID ผู้เล่นของคุณ สกรีนช็อตหน้าจอชนะในเกม และสกรีนช็อตโปรไฟล์เกมของคุณ (หรือตามที่กำหนด)</p><p><br></p><p>2. หลังจากผู้ดูแลระบบตรวจสอบข้อมูลถูกต้องแล้ว รางวัลจะถูกส่งมอบให้คุณ</p>','<p>1.前往 Midasbuy 官方 Discord 社群，聯繫管理員並提供您的玩家 ID、遊戲內中獎頁面截圖以及遊戲個人主頁截圖（或按要求提供）。</p><p><br></p><p>2.管理員核對資訊無誤後，將為您發放獎品。</p>'],['','','["pcImage[0].url","","component/gems-midasbuy_activity_materials/SeasonRechargeI18nTextPicture","",60]','https://pagedoo.midasbuy.com/material/1450015065/1872093168d185841963b07a9ff20d24.jpg','https://pagedoo.midasbuy.com/material/1450015065/e1c0416afeb9cc12db0933c2a10e516a.jpg','https://pagedoo.midasbuy.com/material/1450015065/f47c2afddeed02efcd377fc187996be3.jpg','https://pagedoo.midasbuy.com/material/1450015065/f15e25669b98d2bc5c37ec53e39e87bd.jpg','https://pagedoo.midasbuy.com/material/1450015065/fbd7ad9fa309c45615d49232f1c69d43.jpg','https://pagedoo.midasbuy.com/material/1450015065/e8858f05e24a0840f1e7023fc330dacb.jpg','https://pagedoo.midasbuy.com/material/1450015065/43b52465fe44df7a4f70dce643778ddf.jpg','https://pagedoo.midasbuy.com/material/1450015065/76d23e2c2294abe39dee1de26a2cafea.jpg','https://pagedoo.midasbuy.com/material/1450015065/ddae76010ef88af328ad748da7d92bc7.jpg','https://pagedoo.midasbuy.com/material/1450015065/38f68e4b6ee008d835d45c9632f4e818.jpg','https://pagedoo.midasbuy.com/material/1450015065/4eaae48b7453eed81de5359e97 ave the same number of helpers, whoever reached that number first ranks higher;</p><p>4. After the tracking period ends, a verification period begins. Midasbuy will verify the accuracy of all rankings and screen for leaderboard manipulation. Once verified, players can view the final rankings on the event page;</p><p>5. Only the top 10 players server-wide will receive rewards this season. Rewards can be claimed directly on the event page;</p><p>6. The Amazon Card rewards for the top 3 must be claimed by contacting Midasbuy on Discord;</p><p>7. Cheating and leaderboard manipulation of any kind are strictly prohibited. Violators will have their rankings and rewards revoked.</p>','<p>للمضيفين (الرعاة):<br>\r\r\r\r\r\r\r\r\r\r\n1. شحن يومي → احصل على فرصة مساعدة واحدة (يُحتسب الشحن الأول فقط). سيستهلك حساب Midasbuy أو حساب اللعبة الذي سجّلت الدخول إليه فرصةً بعد المشاركة. يمكن لكل فرصة مشاركة فتح ما يصل إلى 20 جولات من مهام المساعدة؛<br>\r\r\r\r\r\r\r\r\r\r\n2. تتطلب كل مهمة مساعدة 3 مساعدين فريدين (لا مساعدة ذاتية)؛<br>\r\r\r\r\r\r\r\r\r\r\n3. اسحب مكافآت UC يدويًا من:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nللضيوف (المساعدين):<br>\r\r\r\r\r\r\r\r\r\r\n1. ساعد 3 مرات يوميًا (بحد أقصى مرة واحدة يوميًا لكل مضيف | 3 مرات إجماليًا لكل مضيف)؛<br>\r\r\r\r\r\r\r\r\r\r\n2. قسيمة فورية لكل مساعدة؛<br>\r\r\r\r\r\r\r\r\r\r\n3. سيتم إرسال القسيمة إلى معرّف اللاعب الخاص بك. اربط حساب Midasbuy الخاص بك للاستخدام؛<br>\r\r\r\r\r\r\r\r\r\r\n4. ستضيف القسيمة UC إضافية من: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nقواعد لوحة المتصدّرين (للاعبين الأساسيين):<br>\r\r\r\r\r\r\r\r\r\r\n1. هذه لوحة متصدّرين شهرية، وتمتدّ فترة الاحتساب من 23 يوليو 2026 الساعة 00:00 حتى 22 أغسطس 2026 الساعة 23:59 (بتوقيت UTC+8)؛<br>\r\r\r\r\r\r\r\r\r\r\n2. خلال هذه الفترة، يُحتسب إجمالي عدد المساعدين الذين نجح اللاعب الأساسي في دعوتهم. وكلما زاد عدد المساعدين، ارتفع ترتيبك؛<br>\r\r\r\r\r\r\r\r\r\r\n3. في حال تساوى لاعبان في عدد المساعدين، يتقدّم في الترتيب مَن بلغ هذا العدد أولًا؛<br>\r\r\r\r\r\r\r\r\r\r\n4. بعد انتهاء فترة الاحتساب، تبدأ فترة التحقّق، حيث تتحقّق Midasbuy من دقّة جميع الترتيبات وترصد أي تلاعب باللوحة. وبعد التحقّق، يمكن للاعبين الاطّلاع على الترتيب النهائي في صفحة الفعالية؛<br>\r\r\r\r\r\r\r\r\r\r\n5. يحصل على المكافآت هذا الموسم أفضل 10 لاعبين على مستوى الخادم فقط، ويمكن استلام المكافآت مباشرةً من صفحة الفعالية؛<br>\r\r\r\r\r\r\r\r\r\r\n6. أما مكافآت Amazon Card الخاصة بالمراكز الثلاثة الأولى، فيجب استلامها عبر التواصل مع Midasbuy على Discord؛<br>\r\r\r\r\r\r\r\r\r\r\n7. يُمنع منعًا باتًّا الغشّ أو التلاعب باللوحة بأي شكل، وستُلغى ترتيبات ومكافآت كل مخالف.</p>','<p>Para Anfitriones (Patrocinadores):<br>\r\r\r\r\r\r\r\r\r\r\n1. Recarga Diaria → Obtén 1 oportunidad de ayuda (solo la 1ª recarga cuenta). La cuenta de Midasbuy o la cuenta del juego a la que inicies sesión consumirá una oportunidad después de compartir. Cada oportunidad de compartir puede desbloquear un máximo de 20 tareas de asistencia;<br>\r\r\r\r\r\r\r\r\r\r\n2. Cada tarea de asistencia requiere 3 ayudantes únicos (sin autoayuda);<br>\r\r\r\r\r\r\r\r\r\r\n3. Retira manualmente recompensas UC de:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nPara Invitados (Ayudantes):<br>\r\r\r\r\r\r\r\r\r\r\n1. Ayuda 3x/día (máx. 1x/día por anfitrión | 3x total por anfitrión);<br>\r\r\r\r\r\r\r\r\r\r\n2. Cupón instantáneo por ayuda;<br>\r\r\r\r\r\r\r\r\r\r\n3. El cupón se enviará a tu ID de jugador. Vincula tu cuenta de Midasbuy para usar;<br>\r\r\r\r\r\r\r\r\r\r\n4. El cupón añadirá UC extra de: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nReglas de la Clasificación (para jugadores anfitriones):<br>\r\r\r\r\r\r\r\r\r\r\n1. Esta es una clasificación mensual. El periodo de conteo va del 23 de julio de 2026 a las 00:00 hasta el 22 de agosto de 2026 a las 23:59 (UTC+8);<br>\r\r\r\r\r\r\r\r\r\r\n2. Durante este periodo se cuenta el número total de ayudantes que cada jugador anfitrión logra invitar. Cuantos más ayudantes consigas, más alta será tu posición;<br>\r\r\r\r\r\r\r\r\r\r\n3. Si dos jugadores tienen la misma cantidad de ayudantes, quien haya alcanzado esa cifra primero ocupará la posición más alta;<br>\r\r\r\r\r\r\r\r\r\r\n4. Al finalizar el periodo de conteo comienza un periodo de verificación. Midasbuy comprobará la exactitud de todas las clasificaciones y detectará posibles manipulaciones. Tras la verificación, los jugadores podrán consultar la clasificación final en la página del evento;<br>\r\r\r\r\r\r\r\r\r\r\n5. Esta temporada solo los 10 mejores jugadores de todo el servidor recibirán recompensas, que podrán reclamarse directamente en la página del evento;<br>\r\r\r\r\r\r\r\r\r\r\n6. Las recompensas de Amazon Card para los 3 primeros deben reclamarse contactando con Midasbuy a través de Discord;<br>\r\r\r\r\r\r\r\r\r\r\n7. Queda terminantemente prohibido cualquier tipo de trampa o manipulación de la clasificación. A los infractores se les retirarán su posición y sus recompensas.</p>','<p>Für Gastgeber (Sponsoren):<br>\r\r\r\r\r\r\r\r\r\r\n1. Tägliche Aufladung → Erhalten Sie 1 Hilfeschance (nur die 1. Aufladung zählt). Das Midasbuy-Konto oder das Spielkonto, in das Sie sich einloggen, verbraucht nach dem Teilen eine Chance. Jede Teilungsmöglichkeit kann maximal 20 Unterstützungsaufgaben freischalten;<br>\r\r\r\r\r\r\r\r\r\r\n2. Jede Unterstützungsaufgabe erfordert 3 einzigartige Helfer (keine Selbsthilfe);<br>\r\r\r\r\r\r\r\r\r\r\n3. Manueller Abruf von UC-Belohnungen von:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nFür Gäste (Helfer):<br>\r\r\r\r\r\r\r\r\r\r\n1. Helfen Sie 3x/Tag (max. 1x/Tag pro Gastgeber | insgesamt 3x pro Gastgeber);<br>\r\r\r\r\r\r\r\r\r\r\n2. Sofortiger Gutschein pro Hilfe;<br>\r\r\r\r\r\r\r\r\r\r\n3. Der Gutschein wir 0UC Gutscheine (einlösbar für Einkäufe über 60 UC)</p>','<p>30 coupons UC (utilisables pour des achats de plus de 60 UC)</p>','<p>30 kupon UC (dapat digunakan untuk pembelian di atas 60 UC)</p>','<p>30 kupon UC (boleh digunakan untuk pembelian melebihi 60 UC)</p>','<p>30 cupons UC (utilizáveis para compras acima de 60 UC)</p>','<p>30UC купоны (можно использовать для покупок на сумму свыше 60 UC)</p>','<p>30 UC üzeri alışverişlerde kullanılabilen 60 UC kuponu.</p>','<p>คูปอง 30UC (สามารถใช้สำหรับการซื้อสินค้ามูลค่าตั้งแต่ 60 UC)</p>','<p>30UC滿贈券（滿60UC可用）</p>'],['','','["popupConf.popupContent","","component/gems-midasbuy_activity_materials/base_button_popup","guest",6]','<p>For Hosts (Sponsors):</p><p> 1. Daily Recharge → Get 1 help chance (only 1st recharge counts), the Midasbuy account or game account you log in to will consume a chance after sharing. Each sharing opportunity can unlock a maximum of 20 rounds of assist tasks;</p><p> 2. Each assist task requires 3 unique helpers (no self-help);</p><p> 3. Manually draw UC rewards from:</p><p> 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |</p><p><br></p><p> For Guests (Helpers):</p><p> 1. Help 3x/day (max 1x/day per host | 3x total per host);</p><p> 2. Instant coupon per help;</p><p> 3. Coupon will be sent to your Player ID. Bind your Midasbuy account to use;</p><p> 4. Coupon will add extra UC from: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC</p><p><br></p><p> Leaderboard Rules (for Host Players):</p><p> 1. This is a monthly leaderboard. The tracking period runs from July 23, 2026, 00:00 to August 22, 2026, 23:59 (UTC+8);</p><p> 2. During this period, we count the total number of helpers each host player successfully invites. The more helpers you get, the higher you rank;</p><p> 3. If two players have the same number of helpers, whoever reached that number first ranks higher;</p><p> 4. After the tracking period ends, a verification period begins. Midasbuy will verify the accuracy of all rankings and screen for leaderboard manipulation. Once verified, players can view the final rankings on the event page;</p><p> 5. Only the top 10 players server-wide will receive rewards this season. Rewards can be claimed directly on the event page;</p><p> 6. The Amazon Card rewards for the top 3 must be claimed by contacting Midasbuy on Discord;</p><p> 7. Cheating and leaderboard manipulation of any kind are strictly prohibited. Violators will have their rankings and rewards revoked.</p>','<p>للمضيفين (الرعاة):<br>\r\r\r\r\r\r\r\r\r\r\n1. شحن يومي → احصل على فرصة مساعدة واحدة (يُحتسب الشحن الأول فقط). سيستهلك حساب Midasbuy أو حساب اللعبة الذي سجّلت الدخول إليه فرصةً بعد المشاركة. يمكن لكل فرصة مشاركة فتح ما يصل إلى 20 جولات من مهام المساعدة؛<br>\r\r\r\r\r\r\r\r\r\r\n2. تتطلب كل مهمة مساعدة 3 مساعدين فريدين (لا مساعدة ذاتية)؛<br>\r\r\r\r\r\r\r\r\r\r\n3. اسحب مكافآت UC يدويًا من:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nللضيوف (المساعدين):<br>\r\r\r\r\r\r\r\r\r\r\n1. ساعد 3 مرات يوميًا (بحد أقصى مرة واحدة يوميًا لكل مضيف | 3 مرات إجماليًا لكل مضيف)؛<br>\r\r\r\r\r\r\r\r\r\r\n2. قسيمة فورية لكل مساعدة؛<br>\r\r\r\r\r\r\r\r\r\r\n3. سيتم إرسال القسيمة إلى معرّف اللاعب الخاص بك. اربط حساب Midasbuy الخاص بك للاستخدام؛<br>\r\r\r\r\r\r\r\r\r\r\n4. ستضيف القسيمة UC إضافية من: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nقواعد لوحة المتصدّرين (للاعبين الأساسيين):<br>\r\r\r\r\r\r\r\r\r\r\n1. هذه لوحة متصدّرين شهرية، وتمتدّ فترة الاحتساب من 23 يوليو 2026 الساعة 00:00 حتى 22 أغسطس 2026 الساعة 23:59 (بتوقيت UTC+8)؛<br>\r\r\r\r\r\r\r\r\r\r\n2. خلال هذه الفترة، يُحتسب إجمالي عدد المساعدين الذين نجح اللاعب الأساسي في دعوتهم. وكلما زاد عدد المساعدين، ارتفع ترتيبك؛<br>\r\r\r\r\r\r\r\r\r\r\n3. في حال تساوى لاعبان في عدد المساعدين، يتقدّم في الترتيب مَن بلغ هذا العدد أولًا؛<br>\r\r\r\r\r\r\r\r\r\r\n4. بعد انتهاء فترة الاحتساب، تبدأ فترة التحقّق، حيث تتحقّق Midasbuy من دقّة جميع الترتيبات وترصد أي تلاعب باللوحة. وبعد التحقّق، يمكن للاعبين الاطّلاع على الترتيب النهائي في صفحة الفعالية؛<br>\r\r\r\r\r\r\r\r\r\r\n5. يحصل على المكافآت هذا الموسم أفضل 10 لاعبين على مستوى الخادم فقط، ويمكن استلام المكافآت مباشرةً من صفحة الفعالية؛<br>\r\r\r\r\r\r\r\r\r\r\n6. أما مكافآت Amazon Card الخاصة بالمراكز الثلاثة الأولى، فيجب استلامها عبر التواصل مع Midasbuy على Discord؛<br>\r\r\r\r\r\r\r\r\r\r\n7. يُمنع منعًا باتًّا الغشّ أو التلاعب باللوحة بأي شكل، وستُلغى ترتيبات ومكافآت كل مخالف.</p>','<p>Para Anfitriones (Patrocinadores):<br>\r\r\r\r\r\r\r\r\r\r\n1. Recarga Diaria → Obtén 1 oportunidad de ayuda (solo la 1ª recarga cuenta). La cuenta de Midasbuy o la cuenta del juego a la que inicies sesión consumirá una oportunidad después de compartir. Cada oportunidad de compartir puede desbloquear un máximo de 20 tareas de asistencia;<br>\r\r\r\r\r\r\r\r\r\r\n2. Cada tarea de asistencia requiere 3 ayudantes únicos (sin autoayuda);<br>\r\r\r\r\r\r\r\r\r\r\n3. Retira manualmente recompensas UC de:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nPara Invitados (Ayudantes):<br>\r\r\r\r\r\r\r\r\r\r\n1. Ayuda 3x/día (máx. 1x/día por anfitrión | 3x total por anfitrión);<br>\r\r\r\r\r\r\r\r\r\r\n2. Cupón instantáneo por ayuda;<br>\r\r\r\r\r\r\r\r\r\r\n3. El cupón se enviará a tu ID de jugador. Vincula tu cuenta de Midasbuy para usar;<br>\r\r\r\r\r\r\r\r\r\r\n4. El cupón añadirá UC extra de: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nReglas de la Clasificación (para jugadores anfitriones):<br>\r\r\r\r\r\r\r\r\r\r\n1. Esta es una clasificación mensual. El periodo de conteo va del 23 de julio de 2026 a las 00:00 hasta el 22 de agosto de 2026 a las 23:59 (UTC+8);<br>\r\r\r\r\r\r\r\r\r\r\n2. Durante este periodo se cuenta el número total de ayudantes que cada jugador anfitrión logra invitar. Cuantos más ayudantes consigas, más alta será tu posición;<br>\r\r\r\r\r\r\r\r\r\r\n3. Si dos jugadores tienen la misma cantidad de ayudantes, quien haya alcanzado esa cifra primero ocupará la posición más alta;<br>\r\r\r\r\r\r\r\r\r\r\n4. Al finalizar el periodo de conteo comienza un periodo de verificación. Midasbuy comprobará la exactitud de todas las clasificaciones y detectará posibles manipulaciones. Tras la verificación, los jugadores podrán consultar la clasificación final en la página del evento;<br>\r\r\r\r\r\r\r\r\r\r\n5. Esta temporada solo los 10 mejores jugadores de todo el servidor recibirán recompensas, que podrán reclamarse directamente en la página del evento;<br>\r\r\r\r\r\r\r\r\r\r\n6. Las recompensas de Amazon Card para los 3 primeros deben reclamarse contactando con Midasbuy a través de Discord;<br>\r\r\r\r\r\r\r\r\r\r\n7. Queda terminantemente prohibido cualquier tipo de trampa o manipulación de la clasificación. A los infractores se les retirarán su posición y sus recompensas.</p>','<p>Für Gastgeber (Sponsoren):<br>\r\r\r\r\r\r\r\r\r\r\n1. Tägliche Aufladung → Erhalten Sie 1 Hilfeschance (nur die 1. Aufladung zählt). Das Midasbuy-Konto oder das Spielkonto, in das Sie sich einloggen, verbraucht nach dem Teilen eine Chance. Jede Teilungsmöglichkeit kann maximal 20 Unterstützungsaufgaben freischalten;<br>\r\r\r\r\r\r\r\r\r\r\n2. Jede Unterstützungsaufgabe erfordert 3 einzigartige Helfer (keine Selbsthilfe);<br>\r\r\r\r\r\r\r\r\r\r\n3. Manueller Abruf von UC-Belohnungen von:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nFür Gäste (Helfer):<br>\r\r\r\r\r\r\r\r\r\r\n1. Helfen Sie 3x/Tag (max. 1x/Tag pro Gastgeber | insgesamt 3x pro Gastgeber);<br>\r\r\r\r\r\r\r\r\r\r\n2. Sofortiger Gutschein pro Hilfe;<br>\r\r\r\r\r\r\r\r\r\r\n3. Der Gutschein wird an Ihre Spieler-ID gesendet. Binden Sie Ihr Midasbuy-Konto zur Verwendung;<br>\r\r\r\r\r\r\r\r\r\r\n4. Der Gutschein fügt zusätzliche UC hinzu: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 30 UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nLiderlik Tablosu Kuralları (ana oyuncular için):<br>\r\r\r\r\r\r\r\r\r\r\n1. Bu, aylık bir liderlik tablosudur. Sayım dönemi 23 Temmuz 2026, 00:00'dan 22 Ağustos 2026, 23:59'a kadar sürer (UTC+8);<br>\r\r\r\r\r\r\r\r\r\r\n2. Bu dönemde her ana oyuncunun başarıyla davet ettiği toplam yardımcı sayısı hesaplanır. Ne kadar çok yardımcınız olursa sıralamanız o kadar yükselir;<br>\r\r\r\r\r\r\r\r\r\r\n3. İki oyuncunun yardımcı sayısı eşitse, bu sayıya önce ulaşan oyuncu üst sırada yer alır;<br>\r\r\r\r\r\r\r\r\r\r\n4. Sayım dönemi sona erdiğinde bir doğrulama dönemi başlar. Midasbuy tüm sıralamaların doğruluğunu denetler ve tablo manipülasyonlarını tespit eder. Doğrulamanın ardından oyuncular nihai sıralamayı etkinlik sayfasında görebilir;<br>\r\r\r\r\r\r\r\r\r\r\n5. Bu sezon yalnızca sunucu genelindeki ilk 10 oyuncu ödül kazanır ve ödüller doğrudan etkinlik sayfasından alınabilir;<br>\r\r\r\r\r\r\r\r\r\r\n6. İlk 3 oyuncuya verilen Amazon Card ödülleri, Midasbuy ile Discord üzerinden iletişime geçilerek alınmalıdır;<br>\r\r\r\r\r\r\r\r\r\r\n7. Her türlü hile ve sıralama manipülasyonu kesinlikle yasaktır. Kural ihlali yapanların sıralaması ve ödülleri iptal edilir.</p>",'<p>สำหรับโฮสต์ (ผู้สนับสนุน):<br>\r\r\r\r\r\r\r\r\r\r\n1. เติมเงินประจำวัน → รับโอกาสช่วย 1 ครั้ง (นับเฉพาะการเติมเงินครั้งแรก) บัญชี Midasbuy หรือบัญชีเกมที่คุณเข้าสู่ระบบจะใช้โอกาสหลังจากแชร์ 1 ครั้ง โดยแต่ละโอกาสในการแชร์สามารถปลดล็อกงานช่วยเหลือได้สูงสุด 20 รอบ;<br>\r\r\r\r\r\r\r\r\r\r\n2. แต่ละงานช่วยเหลือต้องการผู้ช่วย 3 คน (ไม่สามารถช่วยตัวเองได้);<br>\r\r\r\r\r\r\r\r\r\r\n3. ดึงรางวัล UC ด้วยมือจาก:<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\nสำหรับแขก (ผู้ช่วย):<br>\r\r\r\r\r\r\r\r\r\r\n1. ช่วยได้ 3 ครั้งต่อวัน (สูงสุด 1 ครั้งต่อโฮสต์ | 3 ครั้งรวมต่อโฮสต์);<br>\r\r\r\r\r\r\r\r\r\r\n2. คูปองทันทีต่อการช่วยเหลือ;<br>\r\r\r\r\r\r\r\r\r\r\n3. คูปองจะถูกส่งไปยัง Player ID ของคุณ ผูกบัญชี Midasbuy ของคุณเพื่อใช้;<br>\r\r\r\r\r\r\r\r\r\r\n4. คูปองจะเพิ่ม UC เพิ่มเติมจาก: 3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\nกติกากระดานจัดอันดับ (สำหรับผู้เล่นหลัก):<br>\r\r\r\r\r\r\r\r\r\r\n1. นี่คือกระดานจัดอันดับรายเดือน โดยมีช่วงเวลานับคะแนนตั้งแต่วันที่ 23 กรกฎาคม 2026 เวลา 00:00 น. ถึงวันที่ 22 สิงหาคม 2026 เวลา 23:59 น. (UTC+8);<br>\r\r\r\r\r\r\r\r\r\r\n2. ในช่วงเวลาดังกล่าว จะนับจำนวนผู้ช่วยทั้งหมดที่ผู้เล่นหลักแต่ละคนชวนมาได้สำเร็จ ยิ่งมีผู้ช่วยมาก อันดับก็ยิ่งสูง;<br>\r\r\r\r\r\r\r\r\r\r\n3. หากผู้เล่นสองคนมีจำนวนผู้ช่วยเท่ากัน ผู้ที่ทำถึงจำนวนนั้นได้ก่อนจะได้อันดับสูงกว่า;<br>\r\r\r\r\r\r\r\r\r\r\n4. เมื่อสิ้นสุดช่วงนับคะแนน จะเข้าสู่ช่วงตรวจสอบ โดย Midasbuy จะตรวจสอบความถูกต้องของอันดับทั้งหมดและคัดกรองการปั่นอันดับ เมื่อตรวจสอบเสร็จสิ้น ผู้เล่นจะสามารถดูอันดับสุดท้ายได้ที่หน้ากิจกรรม;<br>\r\r\r\r\r\r\r\r\r\r\n5. ในซีซันนี้ มีเพียงผู้เล่น 10 อันดับแรกของทั้งเซิร์ฟเวอร์เท่านั้นที่จะได้รับรางวัล โดยสามารถรับรางวัลได้โดยตรงที่หน้ากิจกรรม;<br>\r\r\r\r\r\r\r\r\r\r\n6. รางวัล Amazon Card สำหรับ 3 อันดับแรก ต้องติดต่อรับผ่าน Midasbuy ทาง Discord;<br>\r\r\r\r\r\r\r\r\r\r\n7. ห้ามโกงหรือปั่นอันดับทุกรูปแบบโดยเด็ดขาด ผู้ที่ฝ่าฝืนจะถูกริบอันดับและรางวัลทั้งหมด</p>','<p>對於主態玩家：<br>\r\r\r\r\r\r\r\r\r\r\n1. 每日儲值 → 獲得 1 次幫助機會（僅首次儲值計算），登入的 Midasbuy 帳號或遊戲帳號分享過後即消耗限次，一次分享機會最多開啟 20 輪輔助任務；<br>\r\r\r\r\r\r\r\r\r\r\n2. 每輪助力任務需要 3 位不同的玩家（不能自己助力自己）；<br>\r\r\r\r\r\r\r\r\r\r\n3. 手動開啟 UC 獎勵：<br>\r\r\r\r\r\r\r\r\r\r\n3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC | 600UC | 1000UC | 3000UC |<br><br>\r\r\r\r\r\r\r\r\r\r\n給訪客（幫手）：<br>\r\r\r\r\r\r\r\r\r\r\n1. 每天幫助 3 次（每位分享玩家每天最多 1 次 | 每位分享玩家總共 3 次）；<br>\r\r\r\r\r\r\r\r\r\r\n2. 每次幫助即可獲得即時滿贈券；<br>\r\r\r\r\r\r\r\r\r\r\n3. 滿贈券將發送至您的玩家 ID，綁定您的 Midasbuy 帳戶後即可使用；<br>\r\r\r\r\r\r\r\r\r\r\n4. 滿贈券將額外增加 UC 數量：3UC | 6UC | 30UC | 60UC | 75UC | 150UC | 300UC<br><br>\r\r\r\r\r\r\r\r\r\r\n排行榜規則（僅針對主態玩家）：<br>\r\r\r\r\r\r\r\r\r\r\n1. 本榜為月度榜單，統計週期為 2026年7月23日 00:00 ～ 2026年8月22日 23:59（UTC+8）；<br>\r\r\r\r  Players):</p><p>1. This is a monthly leaderboard. The tracking period runs from July 23, 2026, 00:00 to August 22, 2026, 23:59 (UTC+8);</p><p>2. During this period, we count the total number of helpers each host player successfully invites. The more helpers you get, the higher you rank;</p><p>3. If two players have the same number of helpers, whoever reached that number first ranks higher;</p><p>4. After the tracking period ends, a verification period begins. Midasbuy will verify the accuracy of all rankings and screen for leaderboard manipulation. Once verified, players can view the final rankings on the event page;</p><p>5. Only the top 10 players server-wide will receive rewards this season. Rewards can be claimed directly on the event page;</p><p>6. The Amazon Card rewards for the top 3 must be claimed by contacting Midasbuy on Discord;</p><p>7. Cheating and leaderboard manipulation of any kind are strictly prohibited. Violators will have their rankings and rewards revoked.</p>',popupButtonText:'<p>OK</p>'},_v:2},actions:[]},{id:'component/gems-midasbuy_activity_materials@1787133476/HelpEventRecord',name:'HelpEventRecord',key:14,style:{},commonStyle:{size:{autoWidth:false,width:1,autoHeight:true,height:80},transform:{rotate:0,opacity:1,scale:1,radius:0},position:{top:4.497751124437781,left:-533.3333333333334,bottom:0,right:0,type:'absolute',outset:'TopLeft',unit:{left:'percent',right:'percent',top:'percent',bottom:'percent'}}},wrapperStyle:{},data:{modelKey:'',luckDrawModelKeys:['2d4d2c0d-630b-4a5b-ae52-fb2e56c9b985','98dad817-85e4-4c22-9b70-d07f4098e62d','98ac31af-d457-4e87-a362-699dbf273d9e'],commonConf:{title:'<p>Event Record</p>',loadingText:'<p>Loading...</p>',emptyText:'<p>No records found.</p>',claimError:'Oops! The page is stuck! Try refreshing or log out and back in.',bgImage:[{ad_info_list:[],audit_info:'',cover_url:'',create_time:1766392178,file_size:'426.05KB',form_json_schema:'{}',form_submitted:0,form_tag_schema:'{}',group:'',group_list:[],id:'mt1
